services:
  dashboard:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./config:/config
      - ./data:/data
      # dev-only mount (safe even in prod, but optional)
      - ./:/app
      - /app/node_modules
